# 上游后端拓扑 · **后端也在容器里**（Linux 生产 / profile full + web）
#
# 用法（compose 的 nginx 服务挂载本文件为 /etc/nginx/upstream.conf）：
#   .env / .env.prod 里设 NGINX_UPSTREAM_CONF=./deploy/nginx/upstream.linux.conf，
#   然后**一起启动**（推荐）：
#     make full-up ENV_FILE=.env.prod
#     docker compose --env-file .env.prod --profile full --profile web up -d
#   只起网关（`make web-gateway ENV_FILE=.env.prod`）时**api 容器必须已在同网络运行**：
#   nginx 在启动时静态解析 `api:8000`，解析失败会直接 `[emerg] host not found in upstream`
#   并因 `restart: unless-stopped` 进入重启循环（网关完全不可用，不是 502）。
#   验证：curl -sk https://<网关>/api/v1/health → 200
#
# 为什么不能用宿主机变体：原生 Linux 上容器访问不到宿主机**仅绑回环**的端口
# （`host.docker.internal` 是 Docker Desktop 的专有别名，Linux 上是 host-gateway，
# 而 api 容器把 8000 只发布到 127.0.0.1，容器走网关 IP 连不上）→ 全部 502。
# 容器同网络时直接写 compose 服务名即可（DNS 由 compose 提供）。
#
# 横向扩展（注意当前 compose 的 api **不能直接 --scale**）：
#   api 服务带 `container_name` 且固定发布 8000 端口，`--scale api=2` 会直接报错退出
#   （自定义容器名 + 端口占用）。要水平扩展需：去掉 `container_name`、去掉/改端口范围发布，
#   之后**单行 `server api:8000` 就能均衡全部副本**——实测多个容器共享 `api` 别名时
#   nginx 会按请求在多个地址间轮询（不是"只解析到一个地址"）。
#   另注意 nginx 启动时静态解析：扩容/重建副本后需 `docker compose exec nginx nginx -s reload`
#   才生效；要免 reload 可用 nginx ≥1.27 的动态方案（`resolver 127.0.0.11 valid=10s;` + `resolve`）。
upstream qh_api {
    least_conn;
    # profile full 的 api 服务（compose 网络内解析）；容器入口脚本已带迁移分布式锁，
    # 多副本同时启动只会有一个实例真正执行迁移（见 docs/部署.md）。
    server api:8000;
    # 需要多实例时追加（每台按实例数收紧 DB_POOL_SIZE / QUEUE_MAX_*，见 docs/压测报告.md）：
    # server api2:8000;
    keepalive 32;
}
