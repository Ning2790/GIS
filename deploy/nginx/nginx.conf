# 青海旅游 + 农产品平台 —— Nginx 网关（S9/P3 部署卡）
# 由 docker-compose.yml 的 nginx 服务（profile: web）挂载使用，完整步骤见 docs/部署.md。
# 职责：HTTPS（自签起步，可换正式证书）、前端静态托管、/api 反向代理、
#       客户端限流（与后端应用层限流 P1 形成双层防护；应用层身份识别见 TRUST_PROXY_HEADERS）。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;

    # 访问日志含 request_id（N8）：与后端 JSON 日志的 request_id 同源（$request_id），
    # 排障时把网关访问日志与后端日志按该 ID 对齐。
    log_format qh_main escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"request_id":"$request_id"'
        '}';
    access_log /var/log/nginx/access.log qh_main;

    # ---- 客户端限流（第一层；应用层限流见 backend/app/core/rate_limit.py）----
    limit_req_zone $binary_remote_addr zone=rl_auth:10m    rate=2r/s;
    limit_req_zone $binary_remote_addr zone=rl_trade:10m   rate=5r/s;
    limit_req_zone $binary_remote_addr zone=rl_general:10m rate=30r/s;

    # ---- 上游：后端 API ----
    # 拓扑写在**单独的文件**里，部署时按后端跑在哪选择（compose 挂载为
    # /etc/nginx/upstream.conf，用 NGINX_UPSTREAM_CONF 切换）：
    #   deploy/nginx/upstream.conf        后端跑在宿主机（本机 / Windows / macOS，默认）
    #   deploy/nginx/upstream.linux.conf  后端也在容器里（Linux 生产 / profile full + web）
    # 为什么必须分开：原生 Linux 上容器**访问不到宿主机仅绑回环的端口**，
    # 用 host.docker.internal 的拓扑在 Linux 生产会全部 502（见 docs/部署.md）。
    include /etc/nginx/upstream.conf;

    # 离线壳相关路径的 Cache-Control（空值 = 不添加该响应头）：
    # Service Worker 与 manifest 必须可更新，首页壳也应每次校验——否则新 SW 拿不到
    map $uri $qh_shell_no_cache {
        default                     "";
        "~^/(sw\.js|manifest\.webmanifest|index\.html)$"  "no-cache";
        "/"                         "no-cache";
    }

    # HTTP → HTTPS（未来接 Let's Encrypt 时在此加 /.well-known/acme-challenge 放行）
    server {
        listen 80;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 12m;  # 上传上限 10MB + 余量（应用层另有类型/大小白名单）

        # 网关层限流命中时也回统一信封形状（应用层信封见 backend/app/core/errors.py）
        limit_req_status 429;
        error_page 429 = @too_many;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # 请求追踪（N8）：放在 **server 级**——location 里再写 add_header 会屏蔽上面四条
        # 安全头（nginx 的 add_header 不叠加），server 级则对所有响应含 @too_many 生效
        add_header X-Request-ID $request_id always;
        # 离线壳相关文件不缓存（sw.js / manifest / 首页壳）——用 map 变量注入到 server 级
        # add_header，**不新开 location**：location 里再写 add_header 会屏蔽上面几个头
        # （见 $qh_shell_no_cache 定义处）
        add_header Cache-Control $qh_shell_no_cache always;

        # ---- API 反代（按敏感度分桶限流）----
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=rl_auth burst=10 nodelay;
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # 覆盖（而非追加）客户端传入的 XFF：受信代理必须丢弃不可信来源值，
            # 否则应用层按 XFF 识别 IP 时可被伪造头绕过限流。
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 请求追踪（N8）：网关生成 request_id 传给后端，访问日志与后端日志可对齐
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 30s;
        }
        location ~ ^/api/v1/shop/(orders|cart/checkout) {
            limit_req zone=rl_trade burst=20 nodelay;
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 请求追踪（N8）：网关生成 request_id 传给后端，访问日志与后端日志可对齐
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 30s;
        }
        location /api/ {
            limit_req zone=rl_general burst=120 nodelay;
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 请求追踪（N8）：网关生成 request_id 传给后端，访问日志与后端日志可对齐
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 60s;      # AI 接口（mock 快；接真实模型后再调）
            proxy_buffering off;          # 保留 SSE 流式（/api/v1/ai/ask/stream）
        }

        # ---- 指标端点（N10）：只对**监控来源**开放，其余一律 403 ----
        # 应用层不做鉴权（见 app/main.py 的 /metrics），故这里是唯一防线：
        # 默认只放行回环 + Docker 网桥（同机监控容器）；**生产部署务必改成监控机 IP**
        # （或加 basic auth）——放行整个私网会把指标暴露给同网段的任意设备/容器。
        # 另加低配额限流，防止有人把 /metrics 当免费 DDoS 放大器。
        location = /metrics {
            # 抓取也带请求 ID，便于把抓取与后端日志对上
            proxy_set_header X-Request-ID $request_id;
            allow 127.0.0.1;
            allow 172.17.0.0/16;   # docker0 默认网桥
            allow 172.18.0.0/16;   # docker-compose 自定义网络
            deny all;
            limit_req zone=rl_general burst=10 nodelay;
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }

        # ---- 前端静态（构建产物挂载，见 docs/部署.md）----
        location /portal/ {
            alias /usr/share/nginx/html/portal/;
            try_files $uri $uri/ /portal/index.html;
        }
        location /console/ {
            alias /usr/share/nginx/html/console/;
            try_files $uri $uri/ /console/index.html;
        }
        location / {
            root /usr/share/nginx/html/tourist;
            try_files $uri $uri/ /index.html;
        }

        location @too_many {
            default_type application/json;
            return 429 '{"code":42900,"msg":"请求过于频繁（网关层），请稍后再试","data":null}';
        }
    }
}
