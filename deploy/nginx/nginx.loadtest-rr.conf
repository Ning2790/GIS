# 压测网关·**轮询版**（对照实验专用；不要拿去部署）
#
# 与 deploy/nginx/nginx.loadtest.conf 的唯一差异：上游去掉 least_conn（即默认轮询 RR）。
# 用途：复现并解释「轮询下闸门拒绝总集中在一台」——两组配置跑同一负载、同一后端，
# 比较每个上游实例的请求数与 503 数（见 docs/压测报告.md「上游分布对照实验」）。
#
# 启动（与 loadtest 目标同构，端口 9080；**命令要在仓库根执行**——$PWD 指仓库根）：
#   MSYS_NO_PATHCONV=1 docker run -d --rm --name qh_nginx_loadtest -p 127.0.0.1:9080:80 \
#     -v "$PWD/deploy/nginx/nginx.loadtest-rr.conf:/etc/nginx/nginx.conf:ro" \
#     --add-host host.docker.internal:192.168.65.254 nginx:1.27-alpine
#   Git Bash 必须带 MSYS_NO_PATHCONV=1：否则 -v 路径会被 MSYS 拆坏，容器会**静默**
#   用镜像自带配置启动（表现：一堆 404、日志里没有 upstream= 字段）。
#   宿主网关 IP 见 docs/部署.md 的 HOST_GATEWAY（Linux 用 host-gateway）。

worker_processes auto;

events {
    worker_connections 8192;
}

http {
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    # 记录上游地址：多实例轮询的**直接证据**（$upstream_addr 会显示是 8000 还是 8001）
    log_format loadtest '$remote_addr "$request" $status upstream=$upstream_addr '
                        'rt=$request_time request_id=$request_id';
    access_log /dev/stdout loadtest;
    error_log /dev/stderr warn;

    # 上游与生产同构：宿主机上的两个后端实例（**本变体为默认轮询 RR**，用于与
    # least_conn 对照）；上游主机名只解析 IPv4（映射由 Makefile 的 HOST_GATEWAY 传入，
    # 见 deploy/nginx/upstream.conf 与 docs/部署.md）
    upstream qh_api {
        server host.docker.internal:8000;
        server host.docker.internal:8001;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 12m;

        location /api/ {
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 请求追踪（N8）：网关生成 request_id 传给后端，访问日志与后端日志可对齐
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 60s;
            proxy_buffering off;   # 保留 SSE 流式
        }

        location = / {
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # 未代理 /metrics 与 /docs（压测不涉及；指标直接抓后端端口 8000/8001 更准）
    }
}
