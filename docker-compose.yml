# 基础设施容器编排 —— 版本 tag 全部写死，禁止用 latest，保证 5 台电脑环境完全一致。
# 用法：docker compose up -d
# 端口只绑 127.0.0.1（仅本机可访问），避免在宿舍 / 公共网络把数据库、Redis 暴露给同网段；
# Redis 已设置访问密码（dev）。生产环境务必更换全部默认口令。
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: qh_postgres
    # 凭据可用环境变量统一覆盖（默认值即 dev；生产在 .env.prod 里改）。
    # 注意：这三个变量只在**首次初始化数据卷**时生效，已存在的卷不会因改值而变更。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-qh_platform}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qh} -d ${POSTGRES_DB:-qh_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: qh_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  minio:
    # 对象存储（P2 资质文件上传）。注意：MinIO 官方自 2025-10 停止发布社区版容器镜像
    # （Docker Hub 的 minio/minio 已移除、源码仓库归档），改用 Chainguard 的公开镜像
    # （免费、持续重建、无已知 CVE）；digest 锁定保证多台机器环境一致。
    # 升级：docker pull cgr.dev/chainguard/minio:latest 后替换下面的 digest。
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    container_name: qh_minio
    # Chainguard 镜像默认非 root，挂载卷写入受限；以 root 运行与官方镜像行为一致
    user: "0:0"
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata:/data

  # 后端 API（N15 全栈容器化）：与基础设施同网，profile full。
  # 宿主机开发流程不变（仍 `make api`）；本组服务面向「新机器 / 演示环境一条命令起全栈」：
  #   make full-up     # = docker compose --profile full up -d --build
  # 注意：api 把 8000 发布到宿主机（127.0.0.1），这样现有网关（upstream 指向
  # host.docker.internal:8000）无需改动即可反代到容器；**与宿主机跑 make api 互斥**。
  api:
    build:
      context: ./backend
    image: qh-platform-api:0.1.0
    container_name: qh_api
    profiles: ["full"]
    env_file:
      # 限流 / 闸门 / JWT 等配置沿用仓库根 .env；缺失时用应用内默认值启动
      # （全新环境先 `cp .env.example .env`，生产见 docs/部署.md 的容器化章节）
      - path: .env
        required: false
    environment:
      # 容器内用服务名互连：覆盖 .env 里指向 127.0.0.1 的连接串
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qh}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-qh_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev}@redis:6379/1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # slim 镜像没有 curl：用 python 探活（失败即非 0 退出）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 定时任务 / 后台任务（Celery worker + beat），与 api 同镜像不同命令。
  # RUN_MIGRATIONS=0：迁移只由 api 容器执行，避免多容器并发迁移。
  worker:
    build:
      context: ./backend
    image: qh-platform-api:0.1.0
    container_name: qh_worker
    profiles: ["full"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qh}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-qh_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev}@redis:6379/1
      RUN_MIGRATIONS: "0"
    # 显式限制并发：默认按宿主机核数 fork（16 核机器 = 16 个子进程，各带一份应用与
    # 连接池），小机器比例失衡；4 对本项目的定时任务足够（可用 .env 覆盖）
    command: ["celery", "-A", "app.worker", "worker", "-B", "-l", "info", "--concurrency=${CELERY_CONCURRENCY:-4}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # 等 api 迁移完成再启动：否则空库首启时 beat 的每分钟任务会撞上「表不存在」
      api:
        condition: service_healthy
    restart: unless-stopped

  # 网关（P3 部署卡）：HTTPS + 前端静态 + /api 反代 + 网关层限流。
  # 默认不随 docker compose up 启动（profiles），需要时：
  #   make web-gateway        # 或 docker compose --profile web up -d nginx
  # 前置：bash deploy/gen-self-signed-cert.sh 生成证书、前端已 pnpm build。
  # 端口默认只绑本机 127.0.0.1:8080/8443（dev 验证用）；生产部署在 .env 覆盖
  # NGINX_BIND_IP=0.0.0.0、NGINX_HTTP_PORT=80、NGINX_HTTPS_PORT=443，见 docs/部署.md。
  nginx:
    image: nginx:1.27-alpine
    container_name: qh_nginx
    profiles: ["web"]
    ports:
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 上游拓扑（后端在宿主机 vs 后端也在容器）：Linux 生产用 .env 设
      # NGINX_UPSTREAM_CONF=./deploy/nginx/upstream.linux.conf（见 docs/部署.md）
      - ${NGINX_UPSTREAM_CONF:-./deploy/nginx/upstream.conf}:/etc/nginx/upstream.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/apps/tourist/dist:/usr/share/nginx/html/tourist:ro
      - ./frontend/apps/console/dist:/usr/share/nginx/html/console:ro
      - ./frontend/apps/portal/dist:/usr/share/nginx/html/portal:ro
    extra_hosts:
      # 必须是**单个 IPv4**：Docker Desktop 会为 host.docker.internal 注入一条不可达的
      # IPv6，nginx 轮换地址时半数 connect 失败 → 502 + 该上游被摘除 10s（流量全压另一台）。
      # Windows/macOS 在 .env 设 HOST_GATEWAY=192.168.65.254；Linux 保持 host-gateway。
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}" 
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
