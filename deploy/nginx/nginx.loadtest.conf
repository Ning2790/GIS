# 压测专用网关（**仅本地压测使用，不要拿去部署**）
#
# 与 deploy/nginx/nginx.conf 的差异（刻意为之）：
#   1. 去掉按客户端 IP 的限流（rl_auth 2r/s、rl_trade 5r/s、rl_general 30r/s）——
#      限流按 $binary_remote_addr 计，单机压测的所有请求都来自同一个 IP，会被网关
#      先拦下（大量 429），从而测不到**应用层容量**；真实用户来自成千上万不同 IP。
#      网关层限流本身的验收另跑一轮（对着生产网关 8443，见 docs/压测报告.md「网关档」）。
#   2. 去掉静态托管与安全头（不参与压测）；保留其余代理行为：
#      **双实例上游（least_conn）**与生产同构——这正是 N9「多实例」要验的部分。
#   3. 连接数放宽（worker_connections / keepalive），避免网关自身成为瓶颈。
#
# 启动（见 Makefile 的 loadtest-gateway 目标）：
#   docker run -d --rm --name qh_nginx_loadtest -p 127.0.0.1:9080:80 \
#     -v "$PWD/deploy/nginx/nginx.loadtest.conf:/etc/nginx/nginx.conf:ro" \
#     --add-host host.docker.internal:host-gateway nginx:1.27-alpine

worker_processes auto;

events {
    worker_connections 8192;
}

http {
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    # 记录上游地址：多实例轮询的**直接证据**（$upstream_addr 会显示是 8000 还是 8001）
    log_format loadtest '$remote_addr "$request" $status upstream=$upstream_addr '
                        'rt=$request_time request_id=$request_id';
    access_log /dev/stdout loadtest;
    error_log /dev/stderr warn;

    # 上游与生产同构：宿主机上的两个后端实例轮询（部署文档的多实例拓扑）
    # 与生产网关同构：least_conn + 上游主机名只解析 IPv4（映射由 Makefile 的
    # HOST_GATEWAY 传入；见 nginx.conf 与 docs/部署.md）
    upstream qh_api {
        least_conn;
        server host.docker.internal:8000;
        server host.docker.internal:8001;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 12m;

        location /api/ {
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 请求追踪（N8）：网关生成 request_id 传给后端，访问日志与后端日志可对齐
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 60s;
            proxy_buffering off;   # 保留 SSE 流式
        }

        location = / {
            proxy_pass http://qh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # 未代理 /metrics 与 /docs（压测不涉及；指标直接抓后端端口 8000/8001 更准）
    }
}
