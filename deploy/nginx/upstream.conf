# 上游后端拓扑 · **宿主机运行后端**（本机 / Windows / macOS 默认）
#
# 由 deploy/nginx/nginx.conf 在 http 上下文 include（挂载到 /etc/nginx/upstream.conf，
# 见 docker-compose.yml 的 nginx 服务：NGINX_UPSTREAM_CONF 可换成 Linux 变体）。
#
# 说明：
# - 后端进程跑在宿主机（`make api` / `uvicorn`）时只有一个可访问地址：
#   host.docker.internal（Docker Desktop 的宿主机别名，由 compose 的 extra_hosts 提供）。
# - **上游主机名必须只解析出 IPv4**：Docker Desktop 会为 host.docker.internal 注入一条
#   不可达的 IPv6，nginx 轮换地址时半数 connect 失败（502 + 该上游被摘除 10s）。
#   Windows / macOS 在 .env 设 HOST_GATEWAY=<显式 IPv4>（见 docs/部署.md）。
# - `least_conn`（按活跃连接分发）而非默认轮询：交替对照实测（压测报告「多实例」）——
#   轮询下请求均分但在途不均，慢一点的实例会顶满闸门配额成批 503；least_conn 把流量
#   引向空闲实例，同负载拒绝显著更少。横向扩展时逐台追加 server 即可（幂等下单 /
#   库存扣减由数据库约束跨实例兜底，已实测）。
upstream qh_api {
    least_conn;
    server host.docker.internal:8000;
    server host.docker.internal:8001;
    keepalive 32;
}
