name: CI

on:
  push:
    # lingbo 是当前主力开发分支（每次推送都要过 CI）
    branches: [main, lingbo]
  pull_request:

jobs:
  backend:
    name: 后端 lint + 测试 + 契约
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: 格式检查
        run: uv run ruff format --check .

      - name: 测试（含覆盖率门禁：只统计 app/，阈值见 backend/pyproject.toml）
        run: uv run pytest -q --cov=app --cov-report=term-missing

      - name: 依赖漏洞扫描（按 uv.lock 锁定版本审计）
        run: |
          uv export --no-hashes --no-emit-project -o /tmp/requirements-audit.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements-audit.txt

      - name: 导出 OpenAPI 契约
        run: uv run python scripts/export_openapi.py

      - name: 契约一致性（openapi.json 需与代码同步提交）
        working-directory: .
        run: git diff --exit-code -- docs/api/openapi.json

  backend-e2e:
    name: 后端并发 e2e（真 PostgreSQL + Redis + 迁移检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: qh
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: qh_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qh -d qh_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://qh:dev@127.0.0.1:5432/qh_platform
      REDIS_URL: redis://127.0.0.1:6379/0
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 启动 MinIO（文件上传 e2e 用；官方已停止发布社区镜像，用 Chainguard 公开镜像）
        run: |
          docker run -d --name ci-minio --user 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56 \
            server /data
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:9000/minio/health/live; do sleep 2; done'

      - name: 应用数据库迁移
        run: uv run alembic upgrade head

      - name: 迁移漂移检查（模型与迁移必须一致）
        run: uv run alembic check

      - name: 演示数据（并发用例需要景点样例）
        run: uv run python scripts/seed_travel.py

      - name: 并发 e2e
        run: uv run pytest tests_e2e -q

  frontend:
    name: 前端测试 + 类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试（vitest）
        run: pnpm -r test

      - name: 构建（含类型检查）
        run: pnpm -r build
